# Dependabot keeps llmspan's transitive dependency tree current. llmspan
# is the trust boundary that handles production API keys; we need to
# pick up upstream CVE fixes the same week they ship.
#
# Two ecosystems matter:
#   - gomod      : Go module deps (otel, x/crypto, grpc, yaml, …).
#   - github-actions : pinned workflow actions (cosign-installer, syft,
#                      slsa-github-generator, …).
# Container base image (golang alpine, distroless) updates are
# tracked separately via the docker ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      otel:
        # The OTel module set must move as a coherent line. A
        # mixed-version OTel install was the latent footgun
        # closed; group all otel/* updates into one PR per cycle so
        # the alignment stays intact.
        patterns:
          - "go.opentelemetry.io/*"
      grpc-and-friends:
        patterns:
          - "google.golang.org/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
      include: scope
    ignore:
      # Major bumps of workflow actions are made by hand. Several of them sit on
      # the release path (signing, artifact hand-off between release jobs,
      # multi-arch image build and push), which only runs when a tag is pushed
      # and writes to the public Sigstore log, so a bump cannot be exercised
      # beforehand. Bump them together after a public -rc tag has proven the
      # whole release workflow. Minor and patch updates still flow.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker)"
      include: scope
