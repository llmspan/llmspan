  # Batch/flex = 0.5x and fast/priority ~2x are applied by service tier
  # (pricing.CostTiered), not listed here.
  # --- Specialized models, verified 2026-11-24 on the same page (Codex and
  # Embeddings sections). ---
  gpt-5.3-codex: { input_usd_per_mtok: 1.75, output_usd_per_mtok: 14, cached_input_usd_per_mtok: 0.175 }
  text-embedding-3-small: { input_usd_per_mtok: 0.02, output_usd_per_mtok: 0 }
  text-embedding-3-large: { input_usd_per_mtok: 0.13, output_usd_per_mtok: 0 }
  text-embedding-ada-002: { input_usd_per_mtok: 0.1, output_usd_per_mtok: 0 }
  # --- Tombstones: NOT on the 2026-11-24 pricing page, so no price is shipped.
  # `unpriced: true` makes the longest-prefix match report "no price" instead of
  # silently inheriting the shorter parent's rate (e.g. gpt-5.5-mini -> gpt-5.5,
  # o3-mini -> o3, gpt-4.1-nano -> gpt-4.1), which would be wrong. Misses are
  # counted by llmspan.pricing.misses.total. Other removed legacy models
  # (o4-mini, o1*, gpt-4, gpt-4-turbo, gpt-3.5-turbo) have no parent prefix and
  # miss naturally. Override via `pricing.path` if you still run them. ---
  gpt-5.5-mini: { unpriced: true }
  gpt-5.5-nano: { unpriced: true }
  gpt-4.1-nano: { unpriced: true }
  o3-mini: { unpriced: true }

anthropic:
  # --- verified 2026-11-24. cache read = 0.1x input (0.05x Opus 5.5 / Sonnet 5.5,
  # 0.025x Fable/Mythos 5.1+); cache write = 5-minute rate 1.25x (1h = 2x is not
  # distinguishable from usage totals, so 5m is billed). Model IDs verified
  # against platform.claude.com/docs/en/models/overview (current: claude-fable-5-2,
  # claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5) and
  # .../about-claude/models/model-ids-and-versions (4.6+ IDs are dateless pinned
  # snapshots; pre-4.6 IDs are claude-<name>-<maj>-<min>-<YYYYMMDD> with a
  # dateless alias, e.g. claude-sonnet-4-5-20250929 / claude-haiku-4-5-20251001,
  # both matched by prefix). Older/limited IDs (mythos-*, fable-5-1, opus-5, 4.x)
  # follow the same documented scheme; the overview lists them by display name
  # with pricing only. ---
  claude-fable-5-2: { input_usd_per_mtok: 8, output_usd_per_mtok: 40, cached_input_usd_per_mtok: 0.2, cache_creation_input_usd_per_mtok: 10 }
  claude-mythos-5-2: { input_usd_per_mtok: 8, output_usd_per_mtok: 40, cached_input_usd_per_mtok: 0.2, cache_creation_input_usd_per_mtok: 10 }
  claude-fable-5-1: { input_usd_per_mtok: 10, output_usd_per_mtok: 50, cached_input_usd_per_mtok: 0.25, cache_creation_input_usd_per_mtok: 12.5 }
  claude-mythos-5-1: { input_usd_per_mtok: 10, output_usd_per_mtok: 50, cached_input_usd_per_mtok: 0.25, cache_creation_input_usd_per_mtok: 12.5 }
  # Bare ids below prefix-match later minors (see caveat in header).
  claude-fable-5: { input_usd_per_mtok: 10, output_usd_per_mtok: 50, cached_input_usd_per_mtok: 1, cache_creation_input_usd_per_mtok: 12.5 }
  claude-mythos-5: { input_usd_per_mtok: 10, output_usd_per_mtok: 50, cached_input_usd_per_mtok: 1, cache_creation_input_usd_per_mtok: 12.5 }
  claude-opus-5-5: { input_usd_per_mtok: 4, output_usd_per_mtok: 20, cached_input_usd_per_mtok: 0.2, cache_creation_input_usd_per_mtok: 5 }
  claude-opus-5: { input_usd_per_mtok: 5, output_usd_per_mtok: 25, cached_input_usd_per_mtok: 0.5, cache_creation_input_usd_per_mtok: 6.25 }
  claude-opus-4-8: { input_usd_per_mtok: 5, output_usd_per_mtok: 25, cached_input_usd_per_mtok: 0.5, cache_creation_input_usd_per_mtok: 6.25 }
  claude-opus-4-7: { input_usd_per_mtok: 5, output_usd_per_mtok: 25, cached_input_usd_per_mtok: 0.5, cache_creation_input_usd_per_mtok: 6.25 }
  claude-opus-4-6: { input_usd_per_mtok: 5, output_usd_per_mtok: 25, cached_input_usd_per_mtok: 0.5, cache_creation_input_usd_per_mtok: 6.25 }
  claude-opus-4-5: { input_usd_per_mtok: 5, output_usd_per_mtok: 25, cached_input_usd_per_mtok: 0.5, cache_creation_input_usd_per_mtok: 6.25 }
  # opus 4.1 and the retired opus 4 base kept 15/75; no bare "claude-opus-4"
  # fallback exists on purpose so unlisted minors (e.g. 4-9) miss visibly.
  claude-opus-4-1: { input_usd_per_mtok: 15, output_usd_per_mtok: 75, cached_input_usd_per_mtok: 1.5, cache_creation_input_usd_per_mtok: 18.75 }
  claude-opus-4-2025: { input_usd_per_mtok: 15, output_usd_per_mtok: 75, cached_input_usd_per_mtok: 1.5, cache_creation_input_usd_per_mtok: 18.75 }
  # Sonnet 5: $2/$10 is now the standard price (intro-price end on 2026-09-01
  # was cancelled per the pricing page). 5.5 has a 0.05x cache-read rate.
  claude-sonnet-5-5: { input_usd_per_mtok: 2, output_usd_per_mtok: 10, cached_input_usd_per_mtok: 0.1, cache_creation_input_usd_per_mtok: 2.5 }
  claude-sonnet-5: { input_usd_per_mtok: 2, output_usd_per_mtok: 10, cached_input_usd_per_mtok: 0.2, cache_creation_input_usd_per_mtok: 2.5 }
  # Prefix covers Sonnet 4, 4.5, 4.6 and their dated snapshots (all $3/$15).
  claude-sonnet-4: { input_usd_per_mtok: 3, output_usd_per_mtok: 15, cached_input_usd_per_mtok: 0.3, cache_creation_input_usd_per_mtok: 3.75 }
  # Haiku 5.5: prompts >100K tokens (incl. cache tokens) bill at higher rates.
  claude-haiku-5-5: { input_usd_per_mtok: 0.1, output_usd_per_mtok: 0.5, cached_input_usd_per_mtok: 0.01, cache_creation_input_usd_per_mtok: 0.125, long_context_threshold_tokens: 100000, long_input_usd_per_mtok: 0.5, long_output_usd_per_mtok: 2.5, long_cached_input_usd_per_mtok: 0.05, long_cache_creation_input_usd_per_mtok: 0.625 }
  claude-haiku-4-5: { input_usd_per_mtok: 1, output_usd_per_mtok: 5, cached_input_usd_per_mtok: 0.1, cache_creation_input_usd_per_mtok: 1.25 }
  # claude-3-* (3, 3.5, 3.7) are not on the 2026-11-24 pricing or models pages and
  # were removed; they miss visibly via llmspan.pricing.misses.total.

