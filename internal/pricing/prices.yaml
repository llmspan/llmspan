# Built-in pricing catalogue. Snapshot 2026-11 (keep in sync with
# pricing.Snapshot), fetched 2026-11-24 from the providers' official pages:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#   OpenAI:    https://developers.openai.com/api/docs/pricing
#              (openai.com/api/pricing only links here; no token prices)
#   Google:    https://aistudio.google.com/docs/pricing
#              (formerly ai.google.dev/gemini-api/docs/pricing; paid tier,
#              standard, text rates)
# Models: platform.claude.com/docs/en/models/overview, aistudio.google.com/docs/models.
# Pages were read through a summarising fetcher; see docs/PRICING.md for
# the verification notes and anything left unverified.
# Operators should override via `pricing.path` in config for negotiated rates.
#
# Schema: system -> model-prefix -> Rate. Fields (USD per 1M tokens):
#   input_usd_per_mtok, output_usd_per_mtok,
#   cached_input_usd_per_mtok               (cache read; default = input)
#   cache_creation_input_usd_per_mtok       (cache write; default = input)
#   long_context_threshold_tokens + long_input_usd_per_mtok /
#     long_output_usd_per_mtok / long_cached_input_usd_per_mtok /
#     long_cache_creation_input_usd_per_mtok  (whole request is billed at
#     the long rates when the prompt, incl. cache tokens, exceeds the
#     threshold)
#   service_tier_multipliers: {tier: multiplier}  (per-model override of
#     the built-in batch/flex/priority multipliers)
# System names are gen_ai.provider.name values: openai, anthropic, gcp.gen_ai.
# Lookup is longest-prefix-match against the lowercased model string, so
# snapshot pins inherit their family's rate. CAVEAT: a bare id such as
# "claude-opus-5" is a prefix of any later minor ("claude-opus-5-6"), which
# would silently inherit its rate; list every released minor explicitly and
# refresh on each release. Families with no bare-prefix entry (e.g.
# claude-opus-4-*) miss visibly via llmspan.pricing.misses.total.

