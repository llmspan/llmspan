# Production-oriented starting point for llmspan.
# Copy, fill TLS + auth + telemetry, then:
#   llmspan check --config config.production.yaml
#   llmspan up --config config.production.yaml
#
# max_in_flight (256), the circuit breaker (5 failures / 30s, 15s recovery)
# and response_header_timeout (5m) are ON by default; they are spelled out
# below so you can tune them. Set max_in_flight: 0 / breaker.failures: 0 to
# disable. See README "Sizing".

listen: "0.0.0.0:4443"

# A non-loopback bind needs BOTH transport security and caller auth:
#   - tls.cert_file/key_file (or allow_insecure: true temporarily), and
#   - auth.tokens/tokens_file or tls.client_ca_file (mTLS), or the explicit
#     opt-out allow_unauthenticated: true (LLMSPAN_ALLOW_UNAUTHENTICATED).
tls:
  cert_file: /etc/llmspan/tls/tls.crt
  key_file: /etc/llmspan/tls/tls.key

upstreams:
  - name: openai
    prefix: /v1
    target: https://api.openai.com
    provider: openai
    max_in_flight: 256
    breaker:
      failures: 5
      window: 30s
      recovery_window: 15s

  - name: anthropic
    prefix: /anthropic
    target: https://api.anthropic.com
    provider: anthropic
    strip_prefix: true
    max_in_flight: 256
    breaker:
      failures: 5
      window: 30s
      recovery_window: 15s

telemetry:
  # Point at your collector. Plaintext to a non-loopback host requires
  # insecure: true + acknowledge_insecure: true (or
  # LLMSPAN_OTLP_ACKNOWLEDGE_INSECURE=true).
  endpoint: localhost:4317
  protocol: grpc
  insecure: true
  sample_ratio: 1.0
  timeout: 10s

content:
  mode: off
  redact: default

http:
  read_header_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 30s
  body_read_timeout: 30s
  cert_reload_interval: 30s
  stream_idle_timeout: 5m

request:
  max_body_bytes: 33554432

service:
  name: llmspan
  namespace: observability
  environment: production

auth:
  header: X-LLMSPAN-Token
  # Generate with: echo -n 'secret' | llmspan hash-token --name billing
  # `name:<hash>` makes "billing" the caller label (not spoofable via
  # attribution.header). Prefer tokens_file (Secret mount) over inline.
  tokens_file: /etc/llmspan/auth/tokens
  # tokens:
  #   - "billing:$argon2id$v=19$m=65536,t=3,p=2$…"
