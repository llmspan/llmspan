apiVersion: v1
kind: Service
metadata:
  name: {{ include "llmspan.fullname" . }}
  labels:
    {{- include "llmspan.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "llmspan.selectorLabels" . | nindent 4 }}
