# CI smoke-test overlay. Apply on top of the base stack:
#   docker compose -f docker-compose.yml -f docker-compose.smoke.yml up
# or via the driver script: test/smoke/smoke.sh
#
# Swaps the real OpenAI upstream for a local stub (no API key needed),
# and runs llmspan plaintext-on-:4000 like the insecure overlay — the
# smoke test exercises the telemetry pipeline, not TLS.
services:
  stub:
    build:
      context: ../../test/smoke/stub

  # The test only talks to llmspan (:4000) and the Prometheus query API
  # (:9090) from the host. Everything else stays network-internal so
  # the job can't collide with ports already in use on the machine.
  otel-collector:
    ports: !override []
  tempo:
    ports: !override []
  loki:
    ports: !override []
  grafana:
    ports: !override []

  llmspan:
    command: ["up", "--config", "/etc/llmspan/config.yaml"]
    ports: !override
      - "127.0.0.1:4000:4000"
    environment:
      LLMSPAN_LISTEN: "0.0.0.0:4000"
      LLMSPAN_ALLOW_INSECURE: "true"
      LLMSPAN_ALLOW_UNAUTHENTICATED: "true"
      LLMSPAN_TLS_CERT_FILE: ""
      LLMSPAN_TLS_KEY_FILE: ""
      LLMSPAN_OTLP_ENDPOINT: "otel-collector:4317"
      LLMSPAN_OTLP_PROTOCOL: "grpc"
      LLMSPAN_OTLP_INSECURE: "true"
      LLMSPAN_OTLP_ACKNOWLEDGE_INSECURE: "true"
      LLMSPAN_CAPTURE: "off"
      LLMSPAN_ENV: "smoke"
    volumes:
      - ../../test/smoke/llmspan.smoke.yaml:/etc/llmspan/config.yaml:ro
    depends_on:
      stub:
        condition: service_started
