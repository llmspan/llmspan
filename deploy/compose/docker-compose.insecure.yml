# Plaintext-loopback override for the demo stack. Apply with:
#   docker compose -f docker-compose.yml -f docker-compose.insecure.yml up -d
# or via the Makefile target:
#   make compose-up-insecure
#
# Replaces the TLS-on-:4443 default with plaintext-on-:4000 +
# LLMSPAN_ALLOW_INSECURE=true. Use this only for a 30-second
# `curl http://localhost:4000/v1/...` demo — it teaches the wrong
# trust model for production, which is why TLS is the compose default.
services:
  llmspan:
    ports: !override
      - "127.0.0.1:4000:4000"
    environment:
      LLMSPAN_LISTEN: "0.0.0.0:4000"
      LLMSPAN_ALLOW_INSECURE: "true"
      LLMSPAN_ALLOW_UNAUTHENTICATED: "true"
      LLMSPAN_TLS_CERT_FILE: ""
      LLMSPAN_TLS_KEY_FILE: ""
      LLMSPAN_OTLP_ENDPOINT: "otel-collector:4317"
      LLMSPAN_OTLP_PROTOCOL: "grpc"
      LLMSPAN_OTLP_INSECURE: "true"
      LLMSPAN_OTLP_ACKNOWLEDGE_INSECURE: "true"
      LLMSPAN_CAPTURE: "off"
      LLMSPAN_ENV: "demo"
    depends_on:
      otel-collector:
        condition: service_started
